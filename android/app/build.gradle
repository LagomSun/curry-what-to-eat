plugins {
    id 'com.android.application'
}

/* ★ 签名密码不写在代码里（源码要开源）：
   从 local.properties 或环境变量 WTE_KS_PASS / WTE_KEY_PASS 读，
   local.properties 已列入 .gitignore，不会上传。 */
def localProps = new Properties()
def lpFile = rootProject.file('local.properties')
if (lpFile.exists()) localProps.load(new FileInputStream(lpFile))
def ksPass = localProps.getProperty('keystore.storePassword') ?: System.getenv('WTE_KS_PASS') ?: ''
def keyPass = localProps.getProperty('keystore.keyPassword') ?: System.getenv('WTE_KEY_PASS') ?: ksPass

/* ★ 别人 clone 下来还没有自己的签名文件 → 也能直接编译：
   keystore/whattoeat-release.jks 存在才启用签名（出已签名 APK），
   不存在则 release 出未签名包（app-release-unsigned.apk），不会编译报错。 */
def ksFile = rootProject.file('keystore/whattoeat-release.jks')
def hasSigning = ksFile.exists() && ksPass != ''

android {
    namespace 'com.lagomsun.whattoeat'
    compileSdk 34

    defaultConfig {
        applicationId "com.lagomsun.whattoeat"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "2.0"
    }

    /* 零第三方依赖：只用 android.app.Activity + WebView，
       不引 AppCompat / Material，避免 kotlin-stdlib 重复类的坑 */
    signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias 'whattoeat'
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig null
            }
        }
        debug {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
